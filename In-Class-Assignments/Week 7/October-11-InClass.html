<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>MarketStreet</title>
    <link rel="stylesheet" href="October-11-InClass.css" />
    <script src="October-11-InClass.js" defer></script>
  </head>

  <body>
    <header>
      <h1>MarketStreet</h1>
      <p>Paper Trading Platform</p>
    </header>

    <main>
      <h2>Place a Trade</h2>
      <p>Enter your trade information below.</p>

      <!-- JavaScript checks the rules and calls reportValidity() on submit. -->
      <form id="tradeForm" novalidate>
        <fieldset>
          <legend>Trade Information</legend>

          <label for="symbol">Stock Symbol:</label>
          <input
            id="symbol"
            name="symbol"
            type="text"
            placeholder="Example: AAPL"
            required
          />

          <section class="form-row">
            <section class="form-field">
              <label for="trade">Trade Type:</label>
              <select id="trade" name="trade" required>
                <option value="">Select One</option>
                <option value="buy">Buy</option>
                <option value="sell">Sell</option>
              </select>
            </section>

            <section class="form-field">
              <label for="shares">Number of Shares:</label>
              <input
                id="shares"
                name="shares"
                type="number"
                min="1"
                step="1"
                placeholder="Enter number of shares"
                aria-describedby="sharesMessage"
                required
              />

              <p id="sharesMessage" class="error" aria-live="polite"></p>
            </section>
          </section>

          <label for="order">Order Type:</label>
          <select id="order" name="order" required>
            <option value="">Select One</option>
            <option value="market">Market</option>
            <option value="limit">Limit</option>
          </select>

          <label for="price">Limit Price (if needed):</label>
          <input
            id="price"
            name="price"
            type="number"
            min="0.01"
            step="0.01"
            placeholder="Enter limit price"
            aria-describedby="priceHelp priceMessage"
            disabled
          />
          <p id="priceHelp">A limit price is required only for Limit orders.</p>
          <p id="priceMessage" class="error" aria-live="polite"></p>

          <button type="submit">Submit Trade</button>
          <p id="submitMessage" role="status"></p>
        </fieldset>
      </form>
    </main>

    <footer>
      <p>Copyright 2026 MarketStreet</p>
    </footer>
  </body>
</html>
