<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>MarketStreet</title>
  </head>

  <body>
    <header>
      <h1>MarketStreet</h1>
      <p>Use this form to make a paper trade.</p>
    </header>

    <main>
      <form method="get">
        <fieldset>
          <legend>Trade Information</legend>

          <label for="symbol">Stock Symbol:</label>
          <input id="symbol" name="symbol" type="text" required />

          <br /><br />

          <label for="trade">Trade Type:</label>
          <select id="trade" name="trade" required>
            <option value="">Select One</option>
            <option value="buy">Buy</option>
            <option value="sell">Sell</option>
          </select>

          <br /><br />

          <label for="shares">Number of Shares:</label>
          <input
            id="shares"
            name="shares"
            type="number"
            min="1"
            step="1"
            required
          />

          <br /><br />

          <label for="order">Order Type:</label>
          <select id="order" name="order" required>
            <option value="">Select One</option>
            <option value="market">Market</option>
            <option value="limit">Limit</option>
          </select>

          <br /><br />

          <label for="price">Limit Price (if needed):</label>
          <input id="price" name="price" type="number" min="0.01" step="0.01" />

          <br /><br />

          <button type="submit">Submit</button>
        </fieldset>
      </form>
    </main>

    <footer>
      <p>Copyright 2026 MarketStreet</p>
    </footer>
  </body>
</html>
