<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>MarketStreet</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <header>
      <h1>MarketStreet</h1>
      <p>Paper Trading Platform</p>
    </header>

    <main>
      <h2>Place a Trade</h2>
      <p>Enter your trade information below.</p>

      <form method="get">
        <fieldset>
          <legend>Trade Information</legend>

          <label for="symbol">Stock Symbol:</label>
          <input
            id="symbol"
            name="symbol"
            type="text"
            placeholder="Example: AAPL"
            required
          />

          <label for="trade">Trade Type:</label>
          <select id="trade" name="trade" required>
            <option value="">Select One</option>
            <option value="buy">Buy</option>
            <option value="sell">Sell</option>
          </select>

          <label for="shares">Number of Shares:</label>
          <input
            id="shares"
            name="shares"
            type="number"
            min="1"
            step="1"
            placeholder="Enter number of shares"
            required
          />

          <label for="order">Order Type:</label>
          <select id="order" name="order" required>
            <option value="">Select One</option>
            <option value="market">Market</option>
            <option value="limit">Limit</option>
          </select>

          <label for="price">Limit Price (if needed):</label>
          <input
            id="price"
            name="price"
            type="number"
            min="0.01"
            step="0.01"
            placeholder="Enter limit price"
          />

          <button type="submit">Submit Trade</button>
        </fieldset>
      </form>
    </main>

    <footer>
      <p>Copyright 2026 MarketStreet</p>
    </footer>
  </body>
</html>
