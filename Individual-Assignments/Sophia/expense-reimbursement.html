<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
  <title>Expense Reimbursement</title>
  <script src="app.js" defer></script>
</head>
<body>

  <header class="site-header">
    <div class="page-shell">
      <h1>Expense Reimbursement</h1>
      <p>Submit one business expense for reimbursement.</p>
    </div>
  </header>

  <main class="page-shell">
    <section class="intro-section">
      <h2>Before You Submit</h2>
      <p>Complete the required fields below. Keep your receipt available when company policy requires one.</p>
    </section>

    <section>
      <h2>Expense Details</h2>

      <form method="get">
        <fieldset>
          <legend>Expense Information</legend>

          <div class="form-group">
            <label for="employeeId">Employee ID</label>
            <input id="employeeId" name="employeeId" type="text" required>
          </div>

          <!-- Two short related fields share a row on wider screens. -->
          <div class="form-row">
            <div class="form-group">
              <label for="expenseDate">Expense Date</label>
              <input id="expenseDate" name="expenseDate" type="date" required>
            </div>

            <div class="form-group">
              <label for="category">Category</label>
              <select id="category" name="category" required>
                <option value="">Choose a category</option>
                <option value="travel">Travel</option>
                <option value="meals">Meals</option>
                <option value="supplies">Supplies</option>
                <option value="other">Other</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label for="amount">Expense Amount ($)</label>
            <input id="amount" name="amount" type="number" required min="0.01" step="0.01">
            <p id="approvalMessage"></p>
          </div>

          <div class="form-group">
            <label for="description">Business Purpose / Description</label>
            <textarea id="description" name="description" rows="4" required></textarea>
          </div>

          <div class="checkbox-row">
            <input id="receiptAttached" name="receiptAttached" type="checkbox" value="yes">
            <label for="receiptAttached">Receipt attached</label>
          </div>
        </fieldset>

        <button type="submit">Submit Request</button>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <div class="page-shell">
      <p>MIS 3371 — Week 6 Live Demo</p>
    </div>
  </footer>

</body>
</html>
