name: Update Team Activity

on:
  push:
    branches:
      - main
    paths-ignore:
      - "Assets/team-activity.svg"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: team-activity
  cancel-in-progress: true

jobs:
  update-activity:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate team activity heatmap
        shell: bash
        run: |
          mkdir -p Assets

          python <<'PY'
          import subprocess
          from collections import defaultdict, Counter
          from datetime import date, timedelta
          from pathlib import Path
          from xml.sax.saxutils import escape

          output = subprocess.check_output([
              "git",
              "log",
              "--date=short",
              "--pretty=format:%ad%x09%aN%x09%aE"
          ]).decode("utf-8", errors="replace")

          records = []

          for line in output.splitlines():
              parts = line.split("\t")

              if len(parts) != 3:
                  continue

              day, name, email = parts

              # Don't count commits created by this GitHub Action.
              if "bot" in name.lower() or "bot" in email.lower():
                  continue

              commit_date = date.fromisoformat(day)
              key = email.strip().lower() or name.strip().lower()

              records.append((commit_date, key, name.strip()))

          if not records:
              raise SystemExit("No commits found.")

          names = {}

          # git log is newest first, so keep the most recent name.
          for _, key, name in records:
              names.setdefault(key, name)

          activity = defaultdict(Counter)

          for commit_date, key, _ in records:
              activity[key][commit_date] += 1

          contributors = sorted(
              activity.keys(),
              key=lambda key: -sum(activity[key].values())
          )

          first_commit = min(row[0] for row in records)
          last_commit = max(row[0] for row in records)

          # Keep the graphic compact if the repository gets much older.
          max_days = 56

          if (last_commit - first_commit).days + 1 > max_days:
              start_date = last_commit - timedelta(days=max_days - 1)
          else:
              start_date = first_commit

          end_date = last_commit
          days = (end_date - start_date).days + 1

          cell = 13
          gap = 3
          step = cell + gap

          left = 190
          right = 70
          top = 92
          row_height = 30

          width = left + days * step + right
          width = max(width, 700)

          height = top + len(contributors) * row_height + 50

          colors = {
              0: "#ebedf0",
              1: "#9be9a8",
              2: "#40c463",
              3: "#30a14e",
              4: "#216e39"
          }

          svg = []

          svg.append(
              f'<svg xmlns="http://www.w3.org/2000/svg" '
              f'width="{width}" height="{height}" '
              f'viewBox="0 0 {width} {height}">'
          )

          svg.append("""
          <style>
            text {
              font-family: -apple-system, BlinkMacSystemFont,
                           "Segoe UI", Helvetica, Arial, sans-serif;
              fill: #1f2328;
            }

            .empty {
              fill: #ebedf0;
            }

            @media (prefers-color-scheme: dark) {
              text {
                fill: #e6edf3;
              }

              .empty {
                fill: #161b22;
                stroke: #30363d;
                stroke-width: 1;
              }
            }
          </style>
          """)

          total_commits = len(records)

          svg.append(
              '<text x="20" y="28" font-size="20" font-weight="600">'
              'MarketStreet Team Activity'
              '</text>'
          )

          svg.append(
              f'<text x="20" y="50" font-size="12">'
              f'{len(contributors)} contributors · '
              f'{total_commits} commits · '
              f'{first_commit.strftime("%b %Y")} – '
              f'{last_commit.strftime("%b %Y")}'
              '</text>'
          )

          # Date labels.
          for offset in range(0, days, 7):
              current = start_date + timedelta(days=offset)
              x = left + offset * step

              svg.append(
                  f'<text x="{x}" y="76" font-size="10">'
                  f'{current.strftime("%b %d")}'
                  '</text>'
              )

          for row, contributor in enumerate(contributors):
              y = top + row * row_height

              display_name = names[contributor]

              if len(display_name) > 22:
                  display_name = display_name[:21] + "…"

              total = sum(activity[contributor].values())

              svg.append(
                  f'<text x="20" y="{y + 11}" '
                  f'font-size="12" font-weight="500">'
                  f'{escape(display_name)}'
                  '</text>'
              )

              for offset in range(days):
                  current = start_date + timedelta(days=offset)
                  count = activity[contributor][current]

                  level = min(count, 4)

                  x = left + offset * step

                  css_class = ' class="empty"' if count == 0 else ""
                  fill = "" if count == 0 else f' fill="{colors[level]}"'

                  label = "commit" if count == 1 else "commits"

                  svg.append(
                      f'<rect x="{x}" y="{y}" '
                      f'width="{cell}" height="{cell}" rx="2"'
                      f'{css_class}{fill}>'
                      f'<title>{current}: {count} {label}</title>'
                      '</rect>'
                  )

              svg.append(
                  f'<text x="{left + days * step + 10}" '
                  f'y="{y + 11}" font-size="11">'
                  f'{total}'
                  '</text>'
              )

          svg.append("</svg>")

          Path("Assets/team-activity.svg").write_text(
              "\n".join(svg),
              encoding="utf-8"
          )
          PY

      - name: Commit updated activity graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Assets/team-activity.svg

          if git diff --cached --quiet; then
            echo "Activity graph is already up to date."
          else
            git commit -m "Update team activity graph"
            git pull --rebase origin main
            git push
          fi
